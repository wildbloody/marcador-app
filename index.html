<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#06080b;
    --surface:#12151b;
    --surface-2:#1b1f27;
    --surface-3:#262b35;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text:#f3f5f7;
    --text-2:#8d94a1;
    --text-3:#575d69;
    --accent:#19e3ac;
    --accent-soft: rgba(25,227,172,0.13);
    --accent-ink:#00251b;
    --work:#ff8a4c;
    --work-soft: rgba(255,138,76,0.14);
    --rest:#5b8dff;
    --rest-soft: rgba(91,141,255,0.14);
    --success:#19e3ac;
    --success-soft: rgba(25,227,172,0.13);
    --warn:#f5a742;
    --warn-soft: rgba(245,167,66,0.14);
    --danger:#ff5d5d;
    --danger-soft: rgba(255,93,93,0.14);

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
    --r-sm:8px; --r-md:14px; --r-lg:22px; --r-full:999px;

    --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-ui: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    min-height:100dvh;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3{ font-weight:600; letter-spacing:0; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-ink); }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .icon{ vertical-align:-3px; flex-shrink:0; }
  .pr-tag{ font-size:9.5px; font-weight:700; color:var(--success); background:var(--success-soft); padding:1px 5px; border-radius:5px; margin-left:4px; letter-spacing:0.02em; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:900px){
    .app[data-view="home"], .app[data-view="editor"], .app[data-view="explore"]{ max-width:640px; }
  }

  /* ---------- shared bits ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: var(--sp-5) var(--sp-5) var(--sp-2);
  }

  .btn{
    appearance:none;
    border:none;
    background:var(--surface-2);
    color:var(--text);
    padding:12px 16px;
    border-radius:var(--r-md);
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .08s ease, background .15s ease, filter .15s ease, color .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); font-weight:800; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-go{ background:var(--success); color:var(--accent-ink); font-weight:800; }
  .btn-ghost{ background:transparent; color:var(--text-2); border:1px solid var(--border); font-weight:600; }
  .btn-ghost:hover{ color:var(--text); border-color:var(--border-strong); }
  .btn-outline{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); font-weight:700; }
  .btn-outline:hover{ background:var(--accent-soft); }
  .btn-block{ width:100%; }
  .btn-lg{ padding:15px 20px; font-size:16px; }
  .btn-icon{ padding:10px; border-radius:999px; width:44px; height:44px; }
  .btn[disabled]{ opacity:0.35; cursor:not-allowed; }
  .btn-sm{ padding:8px 13px; font-size:12.5px; }

  .card{ background:var(--surface); border-radius:var(--r-md); padding:var(--sp-4); }

  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding-bottom:var(--sp-7);
  }

  /* ---------- empty states ---------- */
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:var(--sp-4); padding:var(--sp-8) var(--sp-5);
  }
  .empty-state-title{ font-family:var(--font-display); font-size:28px; line-height:1.15; letter-spacing:0.01em; color:var(--text); max-width:300px; }
  .empty-state-sub{ color:var(--text-2); font-size:14px; line-height:1.55; max-width:280px; }
  .empty-state-actions{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); margin-top:var(--sp-2); }
  .link-btn{ background:none; border:none; color:var(--text-2); font-size:13.5px; font-weight:700; cursor:pointer; padding:8px; }
  .link-btn:hover{ color:var(--text); }

  /* ---------- top bar / icon buttons (shared) ---------- */
  .topbar-main{ padding:var(--sp-5) var(--sp-5) var(--sp-1); }
  .wordmark{ display:flex; align-items:center; gap:7px; font-family:var(--font-ui); font-weight:800; font-size:15px; letter-spacing:0.18em; color:var(--text); }
  .wordmark-mark{ width:6px; height:6px; background:var(--accent); border-radius:2px; transform:rotate(45deg); flex-shrink:0; }
  .home-context{ padding:2px var(--sp-5) var(--sp-4); color:var(--text-2); font-size:13.5px; }
  .topbar-actions{ display:flex; gap:2px; }
  .icon-btn{
    appearance:none; border:none; background:transparent; color:var(--text-2);
    width:38px; height:38px; border-radius:var(--r-sm); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .12s ease, color .12s ease;
  }
  .icon-btn:hover{ color:var(--text); background:var(--surface-2); }
  .icon-btn.active{ color:var(--accent); background:var(--accent-soft); }
  .icon-text-btn{
    appearance:none; border:none; background:none; color:var(--text-2); font-size:13.5px; font-weight:700;
    padding:8px 6px; margin:0 -6px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  }
  .icon-text-btn:hover{ color:var(--text); background:var(--surface-2); }

  /* ---------- home ---------- */
  .routine-list{ display:flex; flex-direction:column; padding:0 var(--sp-5); }
  .routine-unit{ position:relative; padding:var(--sp-5) 0; border-bottom:1px solid var(--border); }
  .routine-list .routine-unit:last-child{ border-bottom:none; }
  .routine-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-3); }
  .routine-name{ font-family:var(--font-ui); font-weight:800; font-size:21px; color:var(--text); line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .routine-meta{ color:var(--text-2); font-size:13px; margin-top:3px; font-variant-numeric:tabular-nums; }
  .routine-badges{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--r-full); background:var(--surface-2); color:var(--text-2);
    display:inline-flex; align-items:center; gap:4px;
  }
  .routine-cta{ margin-top:var(--sp-4); }
  .btn-start{
    width:100%; height:54px; border:none; border-radius:var(--r-md); background:var(--accent); color:var(--accent-ink);
    font-weight:800; font-size:15.5px; letter-spacing:0.01em; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-start:active{ transform:scale(0.98); }
  .btn-start[disabled]{ opacity:0.35; cursor:not-allowed; }

  .menu-backdrop{ position:fixed; inset:0; z-index:29; background:transparent; }
  .routine-menu{
    position:absolute; top:42px; right:0; z-index:30; min-width:190px;
    background:var(--surface-3); border-radius:var(--r-md);
    padding:6px; display:flex; flex-direction:column; gap:1px;
    box-shadow:0 16px 36px rgba(0,0,0,0.5);
  }
  .routine-menu-item{
    appearance:none; border:none; background:none; color:var(--text); font-size:13.5px; font-weight:600;
    padding:10px 10px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:9px; text-align:left; width:100%;
  }
  .routine-menu-item:hover{ background:var(--surface-2); }
  .routine-menu-item.danger{ color:var(--danger); }
  .routine-menu-item.danger:hover{ background:var(--danger-soft); }
  .routine-menu-sep{ height:1px; background:var(--border); margin:4px 4px; }

  .new-routine-bar{ padding:var(--sp-2) var(--sp-5) var(--sp-5); }
  .add-ghost{
    appearance:none; width:100%; background:transparent; border:none; border-top:1px solid var(--border); color:var(--text-2);
    padding:var(--sp-4) 0 2px; font-size:14.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:color .12s ease;
  }
  .add-ghost:hover{ color:var(--accent); }

  /* ---------- sync (cloud) ---------- */
  .sync-box{ margin:0 var(--sp-5) var(--sp-4); display:flex; flex-direction:column; gap:10px; }
  .sync-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .sync-code{ font-family:var(--font-mono); font-size:20px; letter-spacing:0.12em; color:var(--accent); font-weight:700; }
  .sync-hint{ color:var(--text-3); font-size:12.5px; line-height:1.5; }
  .sync-link-row{ display:flex; gap:8px; }
  .sync-input{
    flex:1; min-width:0; background:var(--surface-2); border:none; color:var(--text);
    border-radius:var(--r-sm); padding:10px 10px; font-family:var(--font-mono); text-transform:uppercase;
    letter-spacing:0.07em; font-size:14px;
  }
  .sync-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .sync-input::placeholder{ text-transform:none; letter-spacing:normal; color:var(--text-3); }
  .sync-status{ font-size:12px; color:var(--text-3); min-height:14px; }
  .sync-status.ok{ color:var(--success); }
  .sync-status.error{ color:var(--danger); }

  /* ---------- editor ---------- */
  .editor-header{ padding:0 var(--sp-5) var(--sp-2); }
  .name-input{
    background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--text);
    font-family:var(--font-display); font-size:32px; letter-spacing:0.01em; padding:var(--sp-2) 2px; width:100%;
  }
  .name-input:focus{ border-bottom-color:var(--accent); }

  .editor-stat{ display:flex; align-items:baseline; gap:9px; padding:0 var(--sp-5) var(--sp-4); }
  .editor-stat .total-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); font-weight:700; }
  .editor-stat .total-time{ font-family:var(--font-mono); font-size:26px; color:var(--text); font-weight:700; }

  .config-wrap{ margin:0 var(--sp-5) var(--sp-4); background:var(--surface); border-radius:var(--r-md); }
  .config-toggle{
    width:100%; background:none; border:none; display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; color:var(--text); font-weight:700; font-size:14px; cursor:pointer;
  }
  .config-toggle .left{ display:flex; align-items:center; gap:9px; }
  .config-toggle .chev{ color:var(--text-3); transition:transform .15s ease; }
  .config-toggle.open .chev{ transform:rotate(180deg); }
  .config-body{ padding:0 16px 16px; display:flex; flex-direction:column; gap:var(--sp-4); border-top:1px solid var(--border); padding-top:14px; margin-top:-2px; }
  .config-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .config-row .label{ font-size:13px; color:var(--text-2); font-weight:600; }
  .config-subhead{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); font-weight:700; margin-top:2px; }
  .goal-input{
    width:58px; background:var(--surface-2); border:none; color:var(--text);
    border-radius:var(--r-sm); padding:8px 6px; font-family:var(--font-mono); text-align:center; font-size:14px;
  }
  .goal-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .delta-pill{ font-size:11px; padding:4px 9px; border-radius:var(--r-full); font-weight:700; font-variant-numeric:tabular-nums; }
  .delta-ok{ background:var(--success-soft); color:var(--success); }
  .delta-mid{ background:var(--warn-soft); color:var(--warn); }
  .delta-off{ background:var(--danger-soft); color:var(--danger); }

  .history-box{ margin-top:var(--sp-4); padding-top:var(--sp-4); border-top:1px solid var(--border); display:flex; flex-direction:column; gap:var(--sp-4); }
  .history-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .history-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); font-weight:700; }
  .history-stats{ display:flex; gap:10px; }
  .stat-tile{ flex:1; background:var(--surface); border-radius:var(--r-sm); padding:10px 12px; }
  .stat-tile .stat-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-3); font-weight:700; }
  .stat-tile .stat-value{ font-family:var(--font-mono); font-size:19px; color:var(--text); font-weight:700; margin-top:2px; }
  .stat-tile.best .stat-value{ color:var(--accent); }
  .history-insight{ display:flex; align-items:center; gap:6px; color:var(--accent); font-size:12.5px; font-weight:700; }
  .history-list{ display:flex; flex-direction:column; }
  .history-row{ display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-2); padding:7px 0; border-bottom:1px solid var(--border); }
  .history-row:last-child{ border-bottom:none; }
  .history-row.best{ color:var(--text); font-weight:700; }
  .history-left{ display:flex; align-items:center; gap:8px; }
  .history-date{ color:var(--text-3); font-variant-numeric:tabular-nums; }
  .history-time{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .history-empty{ color:var(--text-3); font-size:12.5px; line-height:1.5; }

  .chart-empty{ color:var(--text-3); font-size:12.5px; line-height:1.5; }
  .compare-chart{ display:flex; flex-direction:column; gap:8px; padding:4px 0; }
  .compare-chart-svg{ width:100%; height:auto; display:block; }
  .chart-axis{ stroke:var(--border); stroke-width:1; }
  .chart-axis-label{ fill:var(--text-3); font-size:9px; font-family:var(--font-mono); }
  .chart-legend{ display:flex; gap:12px; flex-wrap:wrap; }
  .chart-legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2); }
  .chart-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .chart-hint{ color:var(--text-3); font-size:11.5px; line-height:1.5; }

  .linked-codes-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .linked-code-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:none;
    border-radius:var(--r-full); padding:6px 6px 6px 12px; font-size:13px; color:var(--text);
    font-family:var(--font-mono); letter-spacing:0.05em;
  }
  .code-remove{
    appearance:none; border:none; background:var(--surface-3); color:var(--text-2); width:20px; height:20px;
    border-radius:50%; cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center;
  }
  .code-remove:hover{ color:var(--danger); }
  .toggle-pill{
    display:inline-flex; align-items:center; gap:7px; background:var(--surface-2); border:none;
    border-radius:var(--r-full); padding:8px 14px; font-size:12px; color:var(--text-2); cursor:pointer; align-self:flex-start;
  }
  .toggle-pill.on{ color:var(--text); }

  .explore-header{ padding:var(--sp-2) var(--sp-5) var(--sp-4); }
  .explore-title{ font-family:var(--font-display); font-size:26px; letter-spacing:0.01em; color:var(--text); }
  .explore-sub{ color:var(--text-2); font-size:13.5px; margin-top:2px; }
  .explore-list{ display:flex; flex-direction:column; padding:0 var(--sp-5); }
  .explore-unit{ padding:var(--sp-4) 0; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); }
  .explore-list .explore-unit:last-child{ border-bottom:none; }
  .explore-name{ font-size:16px; font-weight:700; color:var(--text); }
  .explore-meta{ font-size:12.5px; color:var(--text-2); margin-top:2px; }

  .section-label{ padding:var(--sp-2) var(--sp-5) var(--sp-1); font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); font-weight:700; }

  .steps{ display:flex; flex-direction:column; padding:0 var(--sp-5); }
  .step-row{ border-bottom:1px solid var(--border); }
  .steps .step-row:last-child{ border-bottom:none; }
  .step-row.expanded{ background:var(--surface); border-radius:var(--r-md); border-bottom:none; margin:8px 0; padding:14px; }

  .step-summary-row{
    width:100%; background:none; border:none; display:flex; align-items:center; gap:12px;
    padding:14px 2px; cursor:pointer; text-align:left; min-height:44px;
  }
  .step-num{
    width:28px; height:28px; border-radius:50%; background:var(--surface-2); color:var(--text-2);
    font-family:var(--font-mono); font-size:12.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .step-num-btn{ appearance:none; border:none; cursor:pointer; }
  .step-summary-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .step-summary-name{ font-size:15px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .step-summary-meta{ font-size:12.5px; color:var(--text-2); font-family:var(--font-mono); }
  .step-chevron{ color:var(--text-3); flex-shrink:0; }
  .step-summary-row:hover .step-chevron{ color:var(--text-2); }

  .step-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .step-name{
    flex:1; min-width:0; background:var(--surface-2); border:none; color:var(--text);
    border-radius:var(--r-sm); padding:10px 12px; font-size:14.5px; font-weight:700;
  }
  .step-name:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .step-name::placeholder{ color:var(--text-3); font-weight:400; }
  .step-menu{ display:flex; gap:4px; flex-shrink:0; }

  .seg-toggle{ display:flex; background:var(--surface-2); border-radius:var(--r-full); padding:3px; gap:2px; margin-bottom:12px; }
  .seg-toggle button{
    appearance:none; border:none; background:transparent; color:var(--text-2);
    font-size:12px; font-weight:700; padding:8px 12px; border-radius:var(--r-full); cursor:pointer;
    text-transform:uppercase; letter-spacing:0.04em; flex:1;
  }
  .seg-toggle button.active{ background:var(--accent); color:var(--accent-ink); }

  .step-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .metric-box{
    grid-column:span 1; background:var(--surface-2); border-radius:var(--r-sm);
    padding:12px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .metric-box-wide{ grid-column:1 / -1; }
  .metric-box-secondary{ background:transparent; border:1px dashed var(--border-strong); }
  .metric-box-secondary .metric-input-row input{ font-size:16px; }
  .metric-box label{ font-size:10px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; color:var(--text-3); }
  .metric-input-row{ display:flex; align-items:baseline; gap:6px; }
  .metric-box input[type=number]{
    background:transparent; border:none; padding:0; color:var(--text);
    font-family:var(--font-mono); font-size:22px; font-weight:700; width:100%; min-width:0;
  }
  .metric-unit{ color:var(--text-3); font-size:12px; font-family:var(--font-mono); flex-shrink:0; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    appearance:none; border:none; background:var(--surface-3); color:var(--text-2);
    font-family:var(--font-mono); font-size:11.5px; padding:6px 10px; border-radius:var(--r-sm); cursor:pointer;
  }
  .chip:hover{ color:var(--text); }
  .chip.active{ background:var(--accent-soft); color:var(--accent); }

  .tool-btn{
    appearance:none; border:none; background:var(--surface-2); color:var(--text-2);
    width:30px; height:30px; border-radius:var(--r-sm); cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .tool-btn:hover{ color:var(--text); }
  .tool-btn.remove:hover{ color:var(--danger); }
  .tool-btn[disabled]{ opacity:0.3; cursor:not-allowed; }

  .add-step-bar{ padding:var(--sp-2) var(--sp-5) var(--sp-1); }
  .editor-footer{ padding:var(--sp-5); }

  /* ---------- player ---------- */
  .player{ flex:1; display:flex; flex-direction:column; }
  .player-header{ padding:var(--sp-4) var(--sp-5) var(--sp-3); }
  .player-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 0 10px; }
  .player-exit{
    background:none; border:none; color:var(--text-2); font-size:13px; font-weight:700; cursor:pointer;
    padding:8px; margin:-8px; flex-shrink:0; display:inline-flex; align-items:center; gap:3px; border-radius:var(--r-sm);
  }
  .player-exit:hover{ color:var(--text); background:var(--surface-2); }
  .player-title{
    font-size:12.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%;
  }
  .player-total{
    display:block; text-align:center; margin-top:2px;
    font-family:var(--font-mono); color:var(--text-2); font-size:12px; font-variant-numeric:tabular-nums;
  }

  .step-dots{ display:flex; align-items:center; gap:3px; margin-bottom:8px; }
  .step-dot{ flex:1; height:3px; min-width:2px; border-radius:var(--r-full); background:var(--surface-2); }
  .step-dot.done{ background:var(--text-3); }
  .step-dot.active{ background:var(--accent); }

  .hero{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:var(--sp-5); text-align:center;
  }
  .phase-pill{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.14em;
    padding:7px 16px; border-radius:var(--r-full); display:inline-flex; align-items:center; gap:6px;
  }
  .phase-pill.work{ background:var(--work-soft); color:var(--work); }
  .phase-pill.rest{ background:var(--rest-soft); color:var(--rest); }
  .phase-pill.done{ background:var(--success-soft); color:var(--success); }

  .exercise-name{ font-family:var(--font-display); letter-spacing:0.01em; font-size:clamp(28px,8vw,40px); color:var(--text); max-width:22ch; }

  .timer-ring-wrap{ position:relative; width:min(280px,72vw); aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .timer-ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .timer-ring-track{ fill:none; stroke:var(--surface-2); stroke-width:6; }
  .timer-ring-fill{ fill:none; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .timer-ring-fill.work{ stroke:var(--work); }
  .timer-ring-fill.rest{ stroke:var(--rest); }

  .timer-digits{
    position:relative; font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(42px,13vw,64px); line-height:1; letter-spacing:-0.01em;
  }
  .timer-digits.work{ color:var(--work); }
  .timer-digits.rest{ color:var(--rest); }

  .reps-block{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .reps-number{ font-family:var(--font-mono); font-weight:800; font-size:clamp(64px,20vw,96px); color:var(--text); line-height:1; }
  .reps-label{ color:var(--text-2); font-size:12.5px; text-transform:uppercase; letter-spacing:0.12em; font-weight:700; }
  .reps-stopwatch{ font-family:var(--font-mono); color:var(--text-3); font-size:14px; margin-top:6px; }
  .reps-hint{ color:var(--text-3); font-size:12.5px; margin-top:4px; }

  .next-up{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--surface); border-radius:var(--r-md); padding:10px 22px; max-width:100%;
  }
  .next-up-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.14em; color:var(--text-3); font-weight:700; }
  .next-up-name{ font-size:16px; color:var(--text-2); font-weight:700; text-wrap:balance; text-align:center; }

  .controls{ padding:var(--sp-3) var(--sp-5) var(--sp-3); display:flex; flex-direction:column; gap:14px; }
  .done-btn-wrap{ padding:0 2px; }
  .done-btn-wrap .btn-go{ width:100%; height:64px; border-radius:var(--r-md); font-size:17px; }

  .transport{ display:flex; align-items:center; justify-content:center; gap:20px; }
  .transport-side{
    appearance:none; background:none; border:none; color:var(--text-3); width:38px; height:38px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .transport-side:hover{ color:var(--text-2); background:var(--surface); }
  .transport-side[disabled]{ opacity:0.3; cursor:not-allowed; }
  .transport-main{
    appearance:none; border:none; min-width:160px; height:52px; border-radius:var(--r-full);
    font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  .transport-main.primary{ background:var(--accent); color:var(--accent-ink); }
  .transport-main.secondary{ background:var(--surface); color:var(--text); }

  .audio-trigger-row{ display:flex; justify-content:center; }
  .audio-trigger{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-3);
    font-size:12px; font-weight:700; padding:8px 10px; cursor:pointer; border-radius:var(--r-sm);
  }
  .audio-trigger:hover, .audio-trigger.open{ color:var(--text-2); }
  .audio-panel{ background:var(--surface); border-radius:var(--r-md); padding:8px; display:flex; flex-direction:column; gap:2px; }
  .audio-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 8px; border-radius:var(--r-sm); }
  .audio-row .left{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-2); }
  .audio-row.active .left{ color:var(--text); }
  .audio-switch{
    appearance:none; width:36px; height:20px; border-radius:999px; background:var(--surface-3);
    position:relative; flex-shrink:0; border:none; cursor:pointer;
  }
  .audio-switch::after{
    content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--text-2); transition:transform .15s ease, background .15s ease;
  }
  .audio-switch.on{ background:var(--accent-soft); }
  .audio-switch.on::after{ transform:translateX(16px); background:var(--accent); }
  .audio-switch.listening::after{ background:var(--accent); animation:pulse-dot 1.2s ease-in-out infinite; }
  .audio-switch[disabled]{ opacity:0.4; cursor:not-allowed; }
  .audio-error-text{ font-size:11.5px; color:var(--danger); padding:2px 8px 4px; }
  .audio-hint{ font-size:11px; color:var(--text-3); padding:6px 8px 2px; line-height:1.5; }

  @keyframes digit-tick{ 0%{ transform:scale(1); } 40%{ transform:scale(1.045); } 100%{ transform:scale(1); } }
  @keyframes pulse-dot{ 0%,100%{ box-shadow:0 0 0 0 var(--accent-soft);} 50%{ box-shadow:0 0 0 6px var(--accent-soft);} }

  .end-link{ text-align:center; padding:6px 0 0; }
  .end-link button{ background:none; border:none; color:var(--text-3); font-size:12px; cursor:pointer; padding:8px; }
  .end-link button:hover{ color:var(--text-2); }

  /* summary */
  .summary{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:var(--sp-6) var(--sp-5); text-align:center; }
  .summary-check{
    width:64px; height:64px; border-radius:50%; border:2px solid var(--success); color:var(--success);
    display:flex; align-items:center; justify-content:center; animation:summary-pop .5s ease-out;
  }
  .summary-title{ font-family:var(--font-display); font-size:30px; letter-spacing:0.01em; color:var(--text); max-width:300px; }
  .summary-sub{ color:var(--text-2); font-size:14px; }
  .summary-stat{ font-family:var(--font-mono); font-size:44px; font-weight:800; color:var(--text); animation:summary-pop .5s ease-out .05s both; }
  .summary-highlight{ color:var(--accent); display:flex; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:13.5px; }
  .summary-note{ color:var(--text-2); font-size:13.5px; }
  .summary-actions{ display:flex; gap:10px; margin-top:var(--sp-3); width:100%; max-width:320px; }
  .summary-actions .btn{ flex:1; }
  @keyframes summary-pop{ 0%{ opacity:0; transform:scale(0.85); } 100%{ opacity:1; transform:scale(1); } }

  /* flash overlay */
  .flash-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    display:flex; align-items:center; justify-content:center;
    opacity:0; background:transparent;
  }
  .flash-overlay.flashing{ animation:flash-anim 0.9s ease-out; }
  .flash-overlay.flash-work{ background:var(--work); }
  .flash-overlay.flash-rest{ background:var(--rest); }
  .flash-overlay .flash-word{
    font-family:var(--font-display); font-size:15vw; color:rgba(6,8,11,0.85);
    opacity:0; letter-spacing:0.03em;
  }
  .flash-overlay.flashing .flash-word{ animation:word-anim 0.9s ease-out; }

  @keyframes flash-anim{ 0%{opacity:0.7;} 100%{opacity:0;} }
  @keyframes word-anim{ 0%{opacity:0; transform:scale(0.85);} 25%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(1.05);} }

  @media (prefers-reduced-motion: reduce){
    .flash-overlay.flashing, .flash-overlay.flashing .flash-word, .audio-switch.listening::after, .timer-digits, .summary-check, .summary-stat{ animation:none !important; }
  }

  .help{ margin:var(--sp-4) var(--sp-5) 0; }
  .help summary{ cursor:pointer; color:var(--text-3); font-size:12.5px; list-style:none; }
  .help summary::-webkit-details-marker{ display:none; }
  .help summary:before{ content:"?  "; color:var(--text-3); }
  .help[open] summary{ margin-bottom:8px; }
  .help p{ color:var(--text-2); font-size:13px; line-height:1.55; margin-bottom:8px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="flash-overlay" id="flashOverlay"><span class="flash-word" id="flashWord"></span></div>

<script>
(function(){
  "use strict";

  /* ============ storage ============ */
  var STORAGE_KEY = "marcador_v2"; // bumped so everyone gets the new seeded routines below

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function defaultStep(overrides){
    return Object.assign({
      id: uid(),
      name: "",
      type: "time",   // 'time' | 'reps'
      seconds: 30,
      reps: 12,
      estSeconds: 40,
      rest: 20,
      sets: 1          // series: how many times this exercise repeats before moving on
    }, overrides || {});
  }

  /* fills in fields added after a routine may already exist locally or in the cloud,
     so old saved data (and freshly-seeded routines) always have a consistent shape */
  function normalizeRoutine(r){
    if(!Array.isArray(r.history)) r.history = [];
    if(!Array.isArray(r.linkedCodes)) r.linkedCodes = [];
    if(r.shareId === undefined) r.shareId = null;
    if(r.weeklyTarget === undefined) r.weeklyTarget = null;
    if(r.isPublic === undefined) r.isPublic = false;
    if(r.publicId === undefined) r.publicId = null;
    return r;
  }

  function seedRoutines(){
    return [
      {
        id: uid(),
        name: "Fuerza A",
        targetMinutes: null,
        rounds: 1,
        steps: [
          defaultStep({ name:"Press banca (8-10 reps)", type:"reps", reps:10, estSeconds:40, rest:90, sets:3 }),
          defaultStep({ name:"Dominadas (máx. reps, deja 1-2 en reserva)", type:"reps", reps:0, estSeconds:30, rest:90, sets:3 }),
          defaultStep({ name:"Remo en polea baja (10-12 reps)", type:"reps", reps:12, estSeconds:35, rest:75, sets:3 }),
          defaultStep({ name:"Sentadilla con kettlebell (12-15 reps)", type:"reps", reps:15, estSeconds:40, rest:90, sets:3 }),
          defaultStep({ name:"Plancha lateral (20-30s por lado, alterna)", type:"time", seconds:25, rest:45, sets:2 })
        ]
      },
      {
        id: uid(),
        name: "Condicionamiento",
        targetMinutes: null,
        rounds: 1,
        steps: [
          defaultStep({ name:"Burpees", type:"reps", reps:8, estSeconds:35, rest:45, sets:5 }),
          defaultStep({ name:"Sentadillas con salto", type:"reps", reps:10, estSeconds:25, rest:30, sets:3 }),
          defaultStep({ name:"Flexiones (8-12 reps)", type:"reps", reps:12, estSeconds:30, rest:30, sets:3 }),
          defaultStep({ name:"Plancha (30-45s)", type:"time", seconds:38, rest:30, sets:3 })
        ]
      },
      {
        id: uid(),
        name: "Fuerza B",
        targetMinutes: null,
        rounds: 1,
        steps: [
          defaultStep({ name:"Press banca (8-10 reps)", type:"reps", reps:10, estSeconds:40, rest:90, sets:3 }),
          defaultStep({ name:"Dominadas (máx. reps)", type:"reps", reps:0, estSeconds:30, rest:90, sets:3 }),
          defaultStep({ name:"Remo en polea baja (10-12 reps)", type:"reps", reps:12, estSeconds:35, rest:75, sets:3 }),
          defaultStep({ name:"Sentadilla con kettlebell (12-15 reps)", type:"reps", reps:15, estSeconds:40, rest:90, sets:3 }),
          defaultStep({ name:"Plancha lateral (20-30s por lado, alterna)", type:"time", seconds:25, rest:45, sets:2 })
        ]
      },
      {
        id: uid(),
        name: "Suave",
        targetMinutes: null,
        rounds: 3,
        steps: [
          defaultStep({ name:"Sentadillas con kettlebell", type:"reps", reps:12, estSeconds:35, rest:15, sets:1 }),
          defaultStep({ name:"Flexiones (8-10 reps)", type:"reps", reps:10, estSeconds:25, rest:15, sets:1 }),
          defaultStep({ name:"Remo en polea baja", type:"reps", reps:12, estSeconds:30, rest:15, sets:1 }),
          defaultStep({ name:"Plancha", type:"time", seconds:30, rest:15, sets:1 }),
          defaultStep({ name:"Bird-dog (8 por lado)", type:"reps", reps:8, estSeconds:30, rest:15, sets:1 })
        ]
      }
    ];
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.routines && parsed.routines.length){
          parsed.settings = Object.assign({ sound:true, vibration:true, voice:false, announce:true }, parsed.settings || {});
          parsed.routines.forEach(normalizeRoutine);
          return parsed;
        }
      }
    }catch(e){}
    var seeded = { routines: seedRoutines(), settings:{ sound:true, vibration:true, voice:false, announce:true } };
    seeded.routines.forEach(normalizeRoutine);
    return seeded;
  }

  var state = loadState();

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    scheduleCloudSave();
  }

  /* ============ sync (código de sincronización, sin cuentas) ============
     Cada dispositivo genera un código corto y lo guarda localmente. Las
     rutinas se respaldan en Firestore bajo ese código; introducir el mismo
     código en otro dispositivo trae aquí esas rutinas. Conocer el código
     es lo único que hace falta para acceder a esos datos -- no hay login. */
  var firebaseConfig = {
    apiKey: "AIzaSyB69GQjfopRgCT83VAwgr5Fl09EBhzGHAY",
    authDomain: "marcador-app-4b393.firebaseapp.com",
    projectId: "marcador-app-4b393",
    storageBucket: "marcador-app-4b393.firebasestorage.app",
    messagingSenderId: "976928504606",
    appId: "1:976928504606:web:9f41b776762c155719670f"
  };
  var syncDb = null;
  var syncEnabled = false;
  try{
    if(window.firebase){
      firebase.initializeApp(firebaseConfig);
      syncDb = firebase.firestore();
      syncEnabled = true;
    }
  }catch(e){ syncEnabled = false; }

  var SYNC_CODE_KEY = "marcador_sync_code";
  var syncCode = null;
  var syncStatus = "idle"; // idle | saving | ok | error
  var syncSaveTimer = null;

  function genSyncCode(){
    var alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // sin caracteres ambiguos (0/O, 1/I)
    var out = "";
    for(var i=0;i<6;i++) out += alphabet[Math.floor(Math.random()*alphabet.length)];
    return out;
  }

  function ensureSyncCode(){
    try{
      var existing = localStorage.getItem(SYNC_CODE_KEY);
      if(existing){ syncCode = existing; return; }
    }catch(e){}
    syncCode = genSyncCode();
    try{ localStorage.setItem(SYNC_CODE_KEY, syncCode); }catch(e){}
  }

  function setSyncStatus(s){
    syncStatus = s;
    var el = document.getElementById("syncStatusText");
    if(!el) return;
    el.className = "sync-status" + (s==="ok" ? " ok" : s==="error" ? " error" : "");
    el.textContent = s==="saving" ? "Guardando en la nube…" : s==="ok" ? "Copia en la nube al día" : s==="error" ? "No se pudo guardar en la nube" : "";
  }

  function pushToCloud(){
    if(!syncEnabled || !syncCode || !syncDb) return;
    setSyncStatus("saving");
    syncDb.collection("syncCodes").doc(syncCode).set({
      routines: state.routines,
      settings: state.settings,
      updatedAt: Date.now()
    }).then(function(){ setSyncStatus("ok"); }).catch(function(){ setSyncStatus("error"); });
    // any routine shared with other codes also pushes its current definition,
    // so an edit here (name, ejercicios, objetivo) reaches everyone it's linked with
    state.routines.forEach(function(r){
      if(r.shareId) pushSharedDef(r);
    });
  }

  function scheduleCloudSave(){
    if(!syncEnabled) return;
    if(syncSaveTimer) clearTimeout(syncSaveTimer);
    syncSaveTimer = setTimeout(pushToCloud, 900);
  }

  function linkSyncCode(rawCode){
    var code = (rawCode||"").trim().toUpperCase();
    if(!code){ return; }
    if(!syncEnabled || !syncDb){
      window.alert("La sincronización no está disponible ahora mismo.");
      return;
    }
    syncDb.collection("syncCodes").doc(code).get().then(function(doc){
      if(doc.exists){
        var data = doc.data();
        if(data && data.routines && data.routines.length){
          state.routines = data.routines;
          state.routines.forEach(normalizeRoutine);
          state.settings = Object.assign({ sound:true, vibration:true, voice:false, announce:true }, data.settings||{});
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
        }
        syncCode = code;
        try{ localStorage.setItem(SYNC_CODE_KEY, syncCode); }catch(e){}
        checkSharedRoutines();
        render();
        window.alert("Rutinas sincronizadas con el código "+code+".");
      }else{
        syncCode = code;
        try{ localStorage.setItem(SYNC_CODE_KEY, syncCode); }catch(e){}
        pushToCloud();
        render();
        window.alert("Ese código todavía no tenía rutinas guardadas. A partir de ahora, este dispositivo usará el código "+code+".");
      }
    }).catch(function(){
      window.alert("No se pudo conectar con la nube. Comprueba tu conexión e inténtalo de nuevo.");
    });
  }

  /* ============ compartir una rutina con otro código ============
     Cada rutina puede vincularse a otros códigos de sincronización para
     comparar tiempos. El vínculo vive aparte (sharedRoutines/{routine.id}):
     ahí se guarda el nombre, los ejercicios, el objetivo semanal, la lista
     de códigos vinculados y los tiempos que cada código va registrando.
     Cuando cualquiera de los códigos vinculados edita la rutina (nombre,
     ejercicios, objetivo), ese cambio se sube a este documento compartido;
     el resto de códigos lo recogen la próxima vez que abren la app o esa
     rutina en concreto -- es decir, gana la última edición guardada. */
  function shareCodeLabel(code){
    return code === syncCode ? "Tú" : ("Código " + code);
  }

  function linkRoutineCode(routine, rawCode){
    var code = (rawCode||"").trim().toUpperCase();
    if(!code) return;
    if(code === syncCode){ window.alert("Ese es tu propio código."); return; }
    if(routine.linkedCodes.indexOf(code) !== -1){ window.alert("Ese código ya está vinculado a esta rutina."); return; }
    if(!syncEnabled || !syncDb){ window.alert("La sincronización no está disponible ahora mismo."); return; }
    var seen = {};
    var allCodes = [syncCode].concat(routine.linkedCodes, [code]).filter(function(c){
      if(seen[c]) return false; seen[c] = true; return true;
    });
    syncDb.collection("sharedRoutines").doc(routine.id).set({
      name: routine.name,
      steps: routine.steps,
      rounds: routine.rounds,
      weeklyTarget: routine.weeklyTarget || null,
      linkedCodes: allCodes,
      updatedAt: Date.now()
    }, { merge:true }).then(function(){
      routine.linkedCodes = allCodes.filter(function(c){ return c !== syncCode; });
      routine.shareId = routine.id;
      persist();
      render();
    }).catch(function(){ window.alert("No se pudo vincular el código. Comprueba tu conexión e inténtalo de nuevo."); });
  }

  function unlinkRoutineCode(routine, code){
    if(!syncEnabled || !syncDb){ window.alert("La sincronización no está disponible ahora mismo."); return; }
    var remaining = routine.linkedCodes.filter(function(c){ return c !== code; });
    var allCodes = [syncCode].concat(remaining);
    syncDb.collection("sharedRoutines").doc(routine.shareId || routine.id).set({
      linkedCodes: allCodes,
      updatedAt: Date.now()
    }, { merge:true }).then(function(){
      routine.linkedCodes = remaining;
      if(!remaining.length) routine.shareId = null;
      persist();
      render();
    }).catch(function(){ window.alert("No se pudo actualizar. Comprueba tu conexión e inténtalo de nuevo."); });
  }

  function pushSharedDef(routine){
    if(!routine.shareId || !syncEnabled || !syncDb) return;
    syncDb.collection("sharedRoutines").doc(routine.shareId).set({
      name: routine.name,
      steps: routine.steps,
      rounds: routine.rounds,
      weeklyTarget: routine.weeklyTarget || null,
      linkedCodes: [syncCode].concat(routine.linkedCodes)
    }, { merge:true }).catch(function(){});
  }

  function pushSharedEntry(routine, seconds){
    if(!routine.shareId || !syncEnabled || !syncDb) return;
    syncDb.collection("sharedRoutines").doc(routine.shareId).set({
      linkedCodes: [syncCode].concat(routine.linkedCodes),
      entries: firebase.firestore.FieldValue.arrayUnion({ code: syncCode, ts: Date.now(), seconds: seconds })
    }, { merge:true }).catch(function(){});
  }

  function fetchSharedEntries(shareId, cb){
    if(!syncEnabled || !syncDb){ cb(null); return; }
    syncDb.collection("sharedRoutines").doc(shareId).get().then(function(doc){
      if(doc.exists){
        var data = doc.data();
        sharedEntriesCache[shareId] = {
          entries: Array.isArray(data.entries) ? data.entries : [],
          linkedCodes: Array.isArray(data.linkedCodes) ? data.linkedCodes : []
        };
        cb(sharedEntriesCache[shareId]);
      }else{ cb(null); }
    }).catch(function(){ cb(null); });
  }

  function checkSharedRoutines(){
    if(!syncEnabled || !syncDb || !syncCode) return;
    syncDb.collection("sharedRoutines").where("linkedCodes", "array-contains", syncCode).get().then(function(snap){
      var changed = false;
      snap.forEach(function(doc){
        var data = doc.data();
        var existing = state.routines.find(function(r){ return r.shareId === doc.id; });
        var remoteSteps = Array.isArray(data.steps) ? data.steps : [];
        var remoteLinked = (Array.isArray(data.linkedCodes) ? data.linkedCodes : []).filter(function(c){ return c !== syncCode; });
        if(existing){
          // someone else (or this same code, from another device) edited the shared
          // routine since we last saw it -- pull their version so everyone stays in sync
          var remoteStepsJson = JSON.stringify(remoteSteps);
          var defChanged = existing.name !== (data.name || existing.name)
            || JSON.stringify(existing.steps) !== remoteStepsJson
            || existing.rounds !== (data.rounds || existing.rounds)
            || existing.weeklyTarget !== (data.weeklyTarget != null ? data.weeklyTarget : existing.weeklyTarget)
            || JSON.stringify(existing.linkedCodes) !== JSON.stringify(remoteLinked);
          if(defChanged){
            existing.name = data.name || existing.name;
            existing.steps = JSON.parse(remoteStepsJson);
            existing.rounds = data.rounds || existing.rounds;
            existing.weeklyTarget = data.weeklyTarget != null ? data.weeklyTarget : existing.weeklyTarget;
            existing.linkedCodes = remoteLinked;
            changed = true;
          }
        }else{
          var newRoutine = normalizeRoutine({
            id: uid(),
            name: data.name || "Rutina compartida",
            targetMinutes: null,
            rounds: data.rounds || 1,
            steps: JSON.parse(JSON.stringify(remoteSteps)),
            history: []
          });
          newRoutine.shareId = doc.id;
          newRoutine.weeklyTarget = data.weeklyTarget || null;
          newRoutine.linkedCodes = remoteLinked;
          state.routines.push(newRoutine);
          changed = true;
        }
      });
      if(changed){ persist(); render(); }
    }).catch(function(){});
  }

    }).then(function(){

  /* ============ helpers ============ */
  function fmtTime(totalSeconds){
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    var m = Math.floor(totalSeconds/60);
    var s = totalSeconds%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }

  function fmtDate(ts){
    try{ return new Date(ts).toLocaleDateString("es-ES", { day:"2-digit", month:"short" }); }
    catch(e){ return ""; }
  }

  function stepOwnSeconds(step){
    return step.type === "time" ? (Number(step.seconds)||0) : (Number(step.estSeconds)||0);
  }

  function routineTotalSeconds(routine){
    var total = 0;
    routine.steps.forEach(function(step){
      var sets = Math.max(1, Number(step.sets)||1);
      total += sets * (stepOwnSeconds(step) + (Number(step.rest)||0));
    });
    var rounds = Math.max(1, Number(routine.rounds)||1);
    return total * rounds;
  }

  function escapeHtml(str){
    return String(str==null?"":str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function findRoutine(id){

  /* ============ audio / haptics / flash ============ */
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }else if(audioCtx.state === "suspended"){
      audioCtx.resume().catch(function(){});
    }
    return audioCtx;
  }

  function beep(freq, dur, vol, type){
    if(!state.settings.sound) return;
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol||0.25, t0+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + (dur||150)/1000);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + (dur||150)/1000 + 0.03);
    }catch(e){}
  }

  function vibrate(pattern){
    if(!state.settings.vibration) return;
    try{ navigator.vibrate && navigator.vibrate(pattern); }catch(e){}
  }

  function flashScreen(kind, word){
    var overlay = document.getElementById("flashOverlay");
    var wordEl = document.getElementById("flashWord");
    if(!overlay) return;
    overlay.classList.remove("flashing","flash-work","flash-rest");
    // force reflow to restart animation
    void overlay.offsetWidth;
    wordEl.textContent = word || "";
    overlay.classList.add("flashing", kind === "rest" ? "flash-rest" : "flash-work");
    window.setTimeout(function(){
      overlay.classList.remove("flashing","flash-work","flash-rest");
    }, 950);
  }

  /* ============ wake lock ============ */
  var wakeLock = null;
  function requestWakeLock(){
    try{
      if("wakeLock" in navigator){
        navigator.wakeLock.request("screen").then(function(sentinel){
          wakeLock = sentinel;
        }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWakeLock(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){

  /* ============ voice recognition ============
     Listens for the spoken word "hecho" (matching the on-screen button) to
     confirm a rep-based exercise, or advance early, without touching the
     screen. Needs a real top-level HTTPS origin — it will not work through
     a sandboxed iframe or an Android content:// file link. */
  var recognition = null;
  var voiceSupported = false;
  var voiceError = "";
  var voiceListening = false;   // true only once the browser has actually confirmed it is capturing audio
  var voiceWatchdog = null;

  function setupRecognition(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ voiceSupported = false; return; }
    voiceSupported = true;
    try{
      recognition = new SR();
      recognition.lang = "es-ES";
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.onstart = function(){
        voiceListening = true;
        voiceError = "";
        if(voiceWatchdog){ clearTimeout(voiceWatchdog); voiceWatchdog = null; }
        renderPlayerLive();
      };
      recognition.onresult = function(e){
        for(var i=e.resultIndex; i<e.results.length; i++){
          var text = (e.results[i][0].transcript || "").trim().toLowerCase();
          if(text) handleVoiceCommand(text);
        }
      };
      recognition.onerror = function(e){
        voiceListening = false;
        if(e.error === "no-speech"){ return; } // not fatal, onend will restart it
        var msg;
        if(e.error === "not-allowed" || e.error === "service-not-allowed"){
          msg = "Permiso de micrófono bloqueado aquí.";
        }else if(e.error === "audio-capture"){
          msg = "No se detecta ningún micrófono.";
        }else if(e.error === "network"){
          msg = "Sin conexión para reconocer la voz.";
        }else{
          msg = "No se pudo activar el micrófono aquí.";
        }
        state.settings.voice = false;
        voiceError = msg;
        persist();
        renderPlayerLive();
      };
      recognition.onend = function(){
        voiceListening = false;
        // keep listening through a pause too, so "continúa" said out loud can resume it
        if(state.settings.voice && (player.phase === "running" || player.phase === "paused")){
          try{ recognition.start(); }catch(e){
            state.settings.voice = false;
            voiceError = "No se pudo reactivar el micrófono.";
            persist();
            renderPlayerLive();
          }
        }
      };
    }catch(e){ voiceSupported = false; }
  }

  function handleVoiceCommand(text){
    var doneWords = ["hecho","echo","hecha"];
    var skipWords = ["siguiente","saltar"];
    var pauseWords = ["pausa","detente"];
    var resumeWords = ["continua","continúa","reanuda","sigue"];
    function has(list){ return list.some(function(w){ return text.indexOf(w) !== -1; }); }

    if(player.phase !== "running" && player.phase !== "paused") return;

    if(has(doneWords)){
      var item = player.queue[player.index];
      if(item && item.kind === "exercise" && item.type === "reps"){ confirmDone(); }
    } else if(has(skipWords)){
      skipStep();
    } else if(has(pauseWords)){
      pausePlayer();
    } else if(has(resumeWords)){
      resumePlayer();
    }
  }

  function toggleVoice(){
    if(!voiceSupported){ return; }
    state.settings.voice = !state.settings.voice;
    voiceError = "";
    persist();
    if(voiceWatchdog){ clearTimeout(voiceWatchdog); voiceWatchdog = null; }
    if(state.settings.voice){
      voiceListening = false;
      try{
        recognition.start();
        voiceWatchdog = setTimeout(function(){
          if(state.settings.voice && !voiceListening){
            state.settings.voice = false;
            voiceError = "No se pudo activar el micrófono aquí.";
            persist();
            renderPlayerLive();
          }
        }, 2500);
      }catch(e){
        state.settings.voice = false;
        voiceError = "No se pudo activar el micrófono aquí.";
        persist();
      }
    }else{
      try{ recognition.stop(); }catch(e){}
      voiceListening = false;
    }
    renderPlayerLive();
  }

  /* ============ player state machine ============ */
  var player = {
    routine: null,
    queue: [],
    index: -1,
    phase: "idle",      // idle | running | paused | done
    endAt: 0,
    remaining: 0,
    repsElapsed: 0,
    totalPlanned: 0,
    totalElapsed: 0,
    lastTickSecond: null,
    intervalId: null,
    deltaVsTarget: null
  };

  function buildQueue(routine){
    var q = [];
    var rounds = Math.max(1, Number(routine.rounds)||1);
    for(var r=0; r<rounds; r++){
      routine.steps.forEach(function(step, i){
        var name = step.name || ("Ejercicio "+(i+1));
        var sets = Math.max(1, Number(step.sets)||1);
        var rest = Number(step.rest)||0;
        for(var s=0; s<sets; s++){
          q.push({
            kind:"exercise", stepId:step.id, name:name, type:step.type,
            seconds:step.seconds, reps:step.reps, estSeconds:step.estSeconds,
            setIndex:s+1, setsTotal:sets, roundIndex:r+1, roundsTotal:rounds
          });
          if(rest > 0){
            var nextName;
            if(s < sets-1){
              nextName = name; // same exercise, next set
            }else{
              var nextStep = routine.steps[i+1];
              if(nextStep){
                nextName = nextStep.name || "el siguiente ejercicio";
              }else if(r < rounds-1){
                nextName = "la vuelta " + (r+2);
              }else{
                nextName = null;
              }
            }
            q.push({ kind:"rest", seconds:rest, nextName: nextName });
          }
        }
      });
    }
    return q;
  }

  function startWorkout(routineId){
    var routine = findRoutine(routineId);
    if(!routine || !routine.steps.length) return;
    ensureAudio();
    setupRecognition();
    player.routine = routine;
    player.queue = buildQueue(routine);
    player.index = -1;
    player.totalPlanned = routineTotalSeconds(routine);
    player.totalElapsed = 0;
    player.phase = "running";
    requestWakeLock();
    if(state.settings.voice && recognition){ try{ recognition.start(); }catch(e){} }
    goToStep(0);
    if(player.intervalId) clearInterval(player.intervalId);
    player.intervalId = setInterval(onTick, 1000);
    go("player");
  }

  function currentItem(){ return player.queue[player.index]; }

  function goToStep(newIndex){
    if(newIndex >= player.queue.length){
      finishWorkout();
      return;
    }
    if(newIndex < 0) newIndex = 0;
    player.index = newIndex;
    var item = currentItem();
    player.lastTickSecond = null;
    if(item.kind === "rest" || item.type === "time"){
      player.remaining = item.seconds;
      player.endAt = Date.now() + item.seconds*1000;
    }else{
      player.repsElapsed = 0;
    }
    if(item.kind === "rest" && item.nextName){
      speakText("Siguiente: " + item.nextName);
    }
    render();
  }

  function onTick(){
    if(player.phase !== "running") return;
    var item = currentItem();
    if(!item) return;
    player.totalElapsed += 1;

    if(item.kind === "rest" || item.type === "time"){
      var remaining = Math.max(0, Math.round((player.endAt - Date.now())/1000));
      player.remaining = remaining; // keep this live so any full re-render (e.g. voice recognition
                                     // auto-restarting) redraws the real countdown, not the stale
                                     // full-duration value from when the step started
      if(remaining !== player.lastTickSecond){
        player.lastTickSecond = remaining;
        if(remaining <= 3 && remaining > 0) tick3();
        updateTimerDom(remaining, item);
        if(remaining <= 0){
          if(item.kind === "exercise"){ alertExerciseEnd(); } else { alertRestEnd(); }
          window.setTimeout(function(){ goToStep(player.index+1); }, 150);
        }
      }
    }else{
      player.repsElapsed += 1;
      updateRepsStopwatchDom(player.repsElapsed);
    }
    updateTotalElapsedDom();
  }

  function pausePlayer(){
    if(player.phase !== "running") return;
    var item = currentItem();
    if(item && (item.kind === "rest" || item.type === "time")){
      player.remaining = Math.max(0, Math.round((player.endAt - Date.now())/1000));
    }
    player.phase = "paused";
    render();
  }

  function resumePlayer(){
    if(player.phase !== "paused") return;
    var item = currentItem();
    if(item && (item.kind === "rest" || item.type === "time")){
      player.endAt = Date.now() + player.remaining*1000;
      player.lastTickSecond = null;
    }
    player.phase = "running";
    requestWakeLock();
    render();
  }

  function skipStep(){
    if(player.phase === "done") return;
    goToStep(player.index+1);
  }
  function prevStep(){
    if(player.phase === "done") return;
    if(player.index <= 0) return;
    goToStep(player.index-1);
  }
  function confirmDone(){
    var item = currentItem();
    if(item && item.kind === "exercise" && item.type === "reps"){
      goToStep(player.index+1);
    }
  }

  function finishWorkout(){
    player.phase = "done";
    if(player.intervalId){ clearInterval(player.intervalId); player.intervalId = null; }
    releaseWakeLock();
    if(recognition){ try{ recognition.stop(); }catch(e){} }

    var routine = player.routine;
    if(routine){
      var prevTargetSeconds = routine.targetMinutes ? routine.targetMinutes*60 : null;
      player.deltaVsTarget = prevTargetSeconds != null ? (player.totalElapsed - prevTargetSeconds) : null;
      if(!Array.isArray(routine.history)) routine.history = [];
      routine.history.unshift({ ts: Date.now(), seconds: player.totalElapsed });
      if(routine.history.length > 40) routine.history.length = 40;
      routine.targetMinutes = Math.max(1, Math.round(player.totalElapsed/60));
      persist();
      pushSharedEntry(routine, player.totalElapsed);
    }else{
      player.deltaVsTarget = null;
    }

    render();
  }

  function exitWorkout(){
    if(player.phase === "running" || player.phase === "paused"){
      var ok = window.confirm("¿Salir del entrenamiento? Se perderá el progreso de esta sesión.");
      if(!ok) return;
    }
    if(player.intervalId){ clearInterval(player.intervalId); player.intervalId = null; }
    releaseWakeLock();
    if(recognition){ try{ recognition.stop(); }catch(e){} }
    player.phase = "idle";
    go("home");
  }

  /* ---- cheap DOM updates during ticking (avoid full re-render / focus loss) ---- */
  function updateTimerDom(remaining, item){
    var d = document.getElementById("timerDigits");
    if(d){
      d.textContent = fmtTime(remaining);
      d.style.animation = "none";
      void d.offsetWidth; // restart the tick animation every second
      d.style.animation = "digit-tick .25s ease-out";
    }
    var ring = document.getElementById("ringFill");
    if(ring && item){
      var pct = item.seconds > 0 ? Math.max(0, Math.min(100, (remaining/item.seconds)*100)) : 0;
      var CIRC = 339.3;
      ring.style.strokeDashoffset = CIRC * (1 - pct/100);
    }
  }
  function updateRepsStopwatchDom(elapsed){
    var el = document.getElementById("repsStopwatch");
    if(el) el.textContent = fmtTime(elapsed);
  }
  function updateTotalElapsedDom(){
    var el = document.getElementById("totalElapsed");
    if(el) el.textContent = fmtTime(player.totalElapsed) + " / " + fmtTime(player.totalPlanned);
  }

  /* ============ event delegation ============ */
  app.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");
    var id = t.getAttribute("data-id");
    var stepId = t.getAttribute("data-step");

    if(action === "new-routine"){
      var r = normalizeRoutine({ id:uid(), name:"Nueva rutina", targetMinutes:null, rounds:1, steps:[], history:[] });
      state.routines.push(r);
      persist();
      go("editor", { editingId:r.id });
    }else if(action === "edit-routine"){
      openMenuId = null;
      go("editor", { editingId:id });
      var routineBeingEdited = findRoutine(id);
      if(routineBeingEdited && routineBeingEdited.shareId) checkSharedRoutines();
    }else if(action === "start-routine"){
      startWorkout(id);
    }else if(action === "duplicate-routine"){
      var src = findRoutine(id);
      if(src){
        var copy = JSON.parse(JSON.stringify(src));
        copy.id = uid();
        copy.name = src.name + " (copia)";
        copy.history = [];
        copy.linkedCodes = [];
        copy.shareId = null;
        copy.isPublic = false;
        copy.publicId = null;
        copy.steps.forEach(function(s){ s.id = uid(); });
        state.routines.push(copy);
        persist();
        openMenuId = null;
        render();
      }
    }else if(action === "delete-routine"){
      if(window.confirm("¿Eliminar esta rutina? No se puede deshacer.")){
        state.routines = state.routines.filter(function(r){ return r.id !== id; });
        persist();
        openMenuId = null;
        render();
      }
    }else if(action === "toggle-routine-menu"){
      openMenuId = openMenuId === id ? null : id;
      render();
    }else if(action === "close-menu"){
      openMenuId = null;
      render();
    }else if(action === "toggle-sync-panel"){
      syncPanelOpen = !syncPanelOpen;
      render();
    }else if(action === "toggle-config-panel"){
      configPanelOpen = !configPanelOpen;
      render();
    }else if(action === "toggle-audio-panel"){
      audioPanelOpen = !audioPanelOpen;
      render();
    }else if(action === "back-home"){
      go("home");
    }else if(action === "add-step"){
      var routine = findRoutine(editingId);
      if(routine){
        var newStep = defaultStep({});
        collapsedSteps[newStep.id] = false; // open it immediately so it's ready to fill in
        routine.steps.push(newStep);
        persist(); render();
      }
    }else if(action === "remove-step"){
      var routine2 = findRoutine(editingId);
      if(routine2){ routine2.steps = routine2.steps.filter(function(s){ return s.id !== stepId; }); persist(); render(); }
    }else if(action === "duplicate-step"){
      var routine3 = findRoutine(editingId);
      if(routine3){
        var idx = routine3.steps.findIndex(function(s){ return s.id === stepId; });
        if(idx > -1){
          var copyStep = JSON.parse(JSON.stringify(routine3.steps[idx]));
          copyStep.id = uid();
          collapsedSteps[copyStep.id] = false; // open the duplicate so it's easy to tweak right away
          routine3.steps.splice(idx+1,0,copyStep);
          persist(); render();
        }
      }
    }else if(action === "toggle-step"){
      var stepWasCollapsed = collapsedSteps[stepId] !== false; // collapsed by default
      collapsedSteps[stepId] = !stepWasCollapsed;
      render();
    }else if(action === "move-step"){
      var dir = t.getAttribute("data-dir");
      var routine4 = findRoutine(editingId);
      if(routine4){
        var i2 = routine4.steps.findIndex(function(s){ return s.id === stepId; });
        var j = dir === "up" ? i2-1 : i2+1;
        if(i2>-1 && j>-1 && j<routine4.steps.length){
          var tmp = routine4.steps[i2];
          routine4.steps[i2] = routine4.steps[j];
          routine4.steps[j] = tmp;
          persist(); render();
        }
      }
    }else if(action === "set-type"){
      var routine5 = findRoutine(editingId);
      var step5 = routine5 && routine5.steps.find(function(s){ return s.id === stepId; });
      if(step5){ step5.type = t.getAttribute("data-type"); persist(); render(); }
    }else if(action === "chip"){
      var field = t.getAttribute("data-field");
      var val = Number(t.getAttribute("data-val"));
      var routine6 = findRoutine(editingId);
      var step6 = routine6 && routine6.steps.find(function(s){ return s.id === stepId; });
      if(step6){ step6[field] = val; persist(); render(); }
    }else if(action === "start-from-player"){
      // no-op placeholder
    }else if(action === "pause"){ pausePlayer(); render(); }
    else if(action === "resume"){ resumePlayer(); }
    else if(action === "skip"){ skipStep(); }
    else if(action === "prev"){ prevStep(); }
    else if(action === "confirm-done"){ confirmDone(); }
    else if(action === "exit-workout"){ exitWorkout(); }
    else if(action === "toggle-voice"){ toggleVoice(); }
    else if(action === "toggle-sound"){ state.settings.sound = !state.settings.sound; persist(); render(); }
    else if(action === "toggle-announce"){ state.settings.announce = !state.settings.announce; persist(); render(); }
    else if(action === "restart-routine"){ startWorkout(id); }
    else if(action === "toggle-chart"){
      showChartForId = showChartForId === id ? null : id;
      render();
    }
    else if(action === "open-explore"){
      go("explore");
      if(publicRoutinesList === null) fetchPublicRoutines();
    }
    else if(action === "add-public-routine"){
      var pubId = t.getAttribute("data-id");
      var pub = (publicRoutinesList||[]).find(function(p){ return p.id === pubId; });
      if(pub) addPublicRoutineToMine(pub);
    }
    else if(action === "toggle-public"){
      var routineTogglePub = findRoutine(editingId);
      if(routineTogglePub){
        if(routineTogglePub.isPublic) unpublishRoutine(routineTogglePub);
        else publishRoutine(routineTogglePub);
      }
    }
    else if(action === "link-routine-code"){
      var routineLink = findRoutine(editingId);
      var routineCodeInput = document.getElementById("routineCodeInput");
      if(routineLink) linkRoutineCode(routineLink, routineCodeInput ? routineCodeInput.value : "");
    }
    else if(action === "unlink-routine-code"){
      var routineUnlink = findRoutine(editingId);
      var codeToRemove = t.getAttribute("data-code");
      if(routineUnlink && window.confirm("¿Quitar el código "+codeToRemove+" de esta rutina compartida?")){
        unlinkRoutineCode(routineUnlink, codeToRemove);
      }
    }
    else if(action === "goal-chip"){
      var routine7 = findRoutine(editingId);
      if(routine7){ routine7.targetMinutes = Number(t.getAttribute("data-val")); persist(); render(); }
    }else if(action === "copy-sync-code"){
      if(syncCode && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(syncCode).catch(function(){});
      }
      window.alert("Código copiado: "+syncCode);
    }else if(action === "link-sync-code"){
      var codeInput = document.getElementById("syncCodeInput");
      linkSyncCode(codeInput ? codeInput.value : "");
    }else if(action === "toggle-history"){
      expandedHistoryId = expandedHistoryId === id ? null : id;
      openMenuId = null;
      render();
    }
  });

  app.addEventListener("input", function(e){
    var t = e.target;
    var field = t.getAttribute("data-field");
    if(!field) return;
    var stepId = t.getAttribute("data-step");
    var routine = findRoutine(editingId);
    if(!routine) return;

    if(field === "routine-name"){
      routine.name = t.value;
      persist();
      return;
    }
    if(field === "target-minutes"){
      routine.targetMinutes = t.value === "" ? null : Number(t.value);
      persist();
      updateTotalBarDom(routine);
      return;
    }
    if(field === "rounds"){
      var roundsNum = t.value === "" ? 1 : Math.max(1, Number(t.value)||1);
      routine.rounds = roundsNum;
      persist();
      updateTotalBarDom(routine);
      return;
    }
    if(field === "weekly-target"){
      routine.weeklyTarget = t.value === "" ? null : Math.max(0, Number(t.value)||0);
      persist();
      return;
    }
    var step = routine.steps.find(function(s){ return s.id === stepId; });
    if(!step) return;
    if(field === "name"){ step.name = t.value; persist(); return; }
    if(field === "seconds" || field === "estSeconds" || field === "reps" || field === "rest" || field === "sets"){
      var num = t.value === "" ? 0 : Number(t.value);
      if(field === "sets") num = Math.max(1, num||1);
      step[field] = num;
      persist();
      updateTotalBarDom(routine);
      return;
    }
  });

  function updateTotalBarDom(routine){
    var total = routineTotalSeconds(routine);

        var abs = Math.abs(deltaSec);
