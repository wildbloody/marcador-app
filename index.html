  function pad2(n){ return (n<10?"0":"")+n; }
  function weekKey(ts){
    var d = new Date(ts);
    var day = (d.getDay()+6)%7; // 0 = Monday
    var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate()-day);
    return monday.getFullYear()+"-"+pad2(monday.getMonth()+1)+"-"+pad2(monday.getDate());
  }
  function weekLabel(key){
    var parts = key.split("-");
    return parts[2]+"/"+parts[1];
  }

  function renderHistory(routine){
    var hist = Array.isArray(routine.history) ? routine.history : [];
    if(!hist.length){
      return '<div class="history-box"><div class="history-title">Tu progreso</div><div class="history-empty">Aún no has completado esta rutina. Termínala una vez para empezar a ver aquí tu historial de tiempos.</div></div>';
    }
    var bestSeconds = Math.min.apply(null, hist.map(function(h){ return h.seconds; }));
    var lastSeconds = hist[0].seconds; // most recent (history is stored newest-first)

    var html = '<div class="history-box">';
    html += '<div class="history-header"><div class="history-title">Tu progreso</div>';
    if(hist.length > 1 || routine.shareId){
      html += '<button class="icon-text-btn" data-action="toggle-chart" data-id="'+routine.id+'">'+icon("bar-chart",14)+' '+(showChartForId===routine.id?'Ocultar gráfico':'Comparar')+'</button>';
    }
    html += '</div>';

    html += '<div class="history-stats">';
    html += '<div class="stat-tile best"><div class="stat-label">Mejor</div><div class="stat-value">'+fmtTime(bestSeconds)+'</div></div>';
    html += '<div class="stat-tile"><div class="stat-label">Último</div><div class="stat-value">'+fmtTime(lastSeconds)+'</div></div>';
    html += '</div>';

    if(hist.length > 1){
      var firstSeconds = hist[hist.length-1].seconds; // oldest attempt on record
      if(firstSeconds > 0 && lastSeconds < firstSeconds){
        var pct = Math.round(((firstSeconds - lastSeconds) / firstSeconds) * 100);
        if(pct >= 1){
          html += '<div class="history-insight">'+icon("trending-up",14)+' Tardas un '+pct+'% menos que tu primera vez</div>';
        }
      }
    }

    if(showChartForId === routine.id){
      html += routine.shareId ? renderSharedChart(routine) : renderProgressChart(routine);
    }

    html += '<div class="history-list">';
    hist.slice(0,15).forEach(function(h){
      var isBest = h.seconds === bestSeconds;
      html += '<div class="history-row'+(isBest?' best':'')+'">';
      html += '<span class="history-left"><span class="history-date">'+fmtDate(h.ts)+'</span></span>';
      html += '<span class="history-time">'+fmtTime(h.seconds)+(isBest?' <span class="pr-tag">PR</span>':'')+'</span>';
      html += '</div>';
    });
    html += '</div></div>';
    return html;
  }

  function renderProgressChart(routine){
    var hist = Array.isArray(routine.history) ? routine.history : [];
    if(hist.length < 2){
      return '<div class="chart-empty">Hacen falta al menos dos tiempos registrados para ver tu progreso.</div>';
    }
    var pts = hist.slice().sort(function(a,b){ return a.ts - b.ts; });
    var allSeconds = pts.map(function(p){ return p.seconds; });
    var minS = Math.min.apply(null, allSeconds), maxS = Math.max.apply(null, allSeconds);
    if(minS === maxS){ minS = Math.max(0, minS - 10); maxS = maxS + 10; }

    var W = 320, H = 170, padL = 40, padR = 12, padT = 16, padB = 14;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    function xFor(i, count){ return count <= 1 ? padL + innerW/2 : padL + (innerW * (i/(count-1))); }
    function yFor(sec){ return padT + innerH * ((sec - minS) / (maxS - minS)); }

    var path = "";
    pts.forEach(function(p, i){
      var x = xFor(i, pts.length), y = yFor(p.seconds);
      path += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    });

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" class="compare-chart-svg" preserveAspectRatio="xMidYMid meet">';
    svg += '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+innerH)+'" class="chart-axis"/>';
    svg += '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(padL+innerW)+'" y2="'+(padT+innerH)+'" class="chart-axis"/>';
    svg += '<text x="4" y="'+(padT+4)+'" class="chart-axis-label">'+fmtTime(minS)+'</text>';
    svg += '<text x="4" y="'+(padT+innerH+2)+'" class="chart-axis-label">'+fmtTime(maxS)+'</text>';
    svg += '<path d="'+path+'" fill="none" stroke="#19e3ac" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    pts.forEach(function(p, i){
      var x = xFor(i, pts.length), y = yFor(p.seconds);
      svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="#19e3ac"/>';
    });
    svg += '</svg>';

    return '<div class="compare-chart">'+svg+'<div class="chart-hint">Cada punto es un intento, en orden. Cuanto más arriba, más rápido.</div></div>';
  }

  function renderSharedChart(routine){
    var cached = sharedEntriesCache[routine.shareId];
    if(!cached){
      fetchSharedEntries(routine.shareId, function(){ render(); });
      return '<div class="chart-empty">Cargando comparativa…</div>';
    }

    var ownFromLocal = (routine.history||[]).map(function(h){ return { code: syncCode, ts: h.ts, seconds: h.seconds }; });
    var seenKeys = {};
    var merged = (cached.entries||[]).concat(ownFromLocal).filter(function(e){
      var k = e.code+"|"+e.ts;
      if(seenKeys[k]) return false;
      seenKeys[k] = true;
      return true;
    });
    if(merged.length < 2){
      return '<div class="chart-empty">Hacen falta al menos dos tiempos registrados (entre los códigos vinculados) para comparar.</div>';
    }

    var codes = [syncCode].concat(routine.linkedCodes);
    var byCode = {};
    merged.forEach(function(e){
      if(codes.indexOf(e.code) === -1) codes.push(e.code);
      if(!byCode[e.code]) byCode[e.code] = {};
      var wk = weekKey(e.ts);
      if(!byCode[e.code][wk]) byCode[e.code][wk] = [];
      byCode[e.code][wk].push(e.seconds);
    });

    var allWeeks = [];
    Object.keys(byCode).forEach(function(c){
      Object.keys(byCode[c]).forEach(function(wk){ if(allWeeks.indexOf(wk) === -1) allWeeks.push(wk); });
    });
    allWeeks.sort();

    var series = {};
    codes.forEach(function(c){
      if(!byCode[c]) return;
      var pts = [];
      allWeeks.forEach(function(wk, wi){
        if(byCode[c][wk]){
          var arr = byCode[c][wk];
          var avg = arr.reduce(function(a,b){ return a+b; }, 0) / arr.length;
          pts.push({ weekIndex: wi, seconds: avg });
        }
      });
      if(pts.length) series[c] = pts;
    });
    var activeCodes = codes.filter(function(c){ return series[c] && series[c].length; });
    if(!activeCodes.length){
      return '<div class="chart-empty">Aún no hay suficientes datos para comparar por semana.</div>';
    }

    var allVals = [];
    activeCodes.forEach(function(c){ series[c].forEach(function(p){ allVals.push(p.seconds); }); });
    var minS = Math.min.apply(null, allVals), maxS = Math.max.apply(null, allVals);
    if(minS === maxS){ minS = Math.max(0, minS - 10); maxS = maxS + 10; }

    var W = 320, H = 170, padL = 40, padR = 12, padT = 16, padB = 22;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var weekCount = allWeeks.length;
    function xFor(wi){ return weekCount <= 1 ? padL + innerW/2 : padL + (innerW * (wi/(weekCount-1))); }
    function yFor(sec){ return padT + innerH * ((sec - minS) / (maxS - minS)); }
    var colors = ["#19e3ac","#ff8a4c","#5b8dff","#f5a742","#c084fc","#ff5d5d"];

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" class="compare-chart-svg" preserveAspectRatio="xMidYMid meet">';
    svg += '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+innerH)+'" class="chart-axis"/>';
    svg += '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(padL+innerW)+'" y2="'+(padT+innerH)+'" class="chart-axis"/>';
    svg += '<text x="4" y="'+(padT+4)+'" class="chart-axis-label">'+fmtTime(minS)+'</text>';
    svg += '<text x="4" y="'+(padT+innerH+2)+'" class="chart-axis-label">'+fmtTime(maxS)+'</text>';
    if(weekCount){
      svg += '<text x="'+xFor(0).toFixed(1)+'" y="'+(padT+innerH+14)+'" text-anchor="middle" class="chart-axis-label">'+weekLabel(allWeeks[0])+'</text>';
      if(weekCount > 1){
        svg += '<text x="'+xFor(weekCount-1).toFixed(1)+'" y="'+(padT+innerH+14)+'" text-anchor="middle" class="chart-axis-label">'+weekLabel(allWeeks[weekCount-1])+'</text>';
      }
    }
    activeCodes.forEach(function(code, ci){
      var pts = series[code];
      var color = colors[ci % colors.length];
      var path = "";
      pts.forEach(function(p, i){
        var x = xFor(p.weekIndex), y = yFor(p.seconds);
        path += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
      });
      svg += '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      pts.forEach(function(p){
        var x = xFor(p.weekIndex), y = yFor(p.seconds);
        svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="'+color+'"/>';
      });
    });
    svg += '</svg>';

    var legend = '<div class="chart-legend">';
    activeCodes.forEach(function(code, ci){
      legend += '<span class="chart-legend-item"><span class="chart-dot" style="background:'+colors[ci % colors.length]+'"></span>'+escapeHtml(shareCodeLabel(code))+'</span>';
    });
    legend += '</div>';

    var targetHtml = routine.weeklyTarget ? '<div class="chart-hint">Objetivo: '+routine.weeklyTarget+' vez'+(routine.weeklyTarget===1?'':'es')+' por semana</div>' : '';

    return '<div class="compare-chart">'+svg+legend+'<div class="chart-hint">Cada punto es la media de esa semana. Cuanto más arriba, más rápido.</div>'+targetHtml+'</div>';
  }

  function renderExplore(){
    var html = "";
    html += '<div class="screen">';
    html += '<div class="topbar"><button class="icon-text-btn" data-action="back-home">'+icon("chevron-left",16)+' Rutinas</button></div>';
    html += '<div class="explore-header"><div class="explore-title">Descubre</div><div class="explore-sub">Rutinas de la comunidad</div></div>';
    if(publicRoutinesList === "loading" || publicRoutinesList === null){
      html += '<div class="empty-state"><div class="empty-state-sub">Cargando rutinas públicas…</div></div>';
    }else if(!publicRoutinesList.length){
      html += '<div class="empty-state">';
      html += '<div class="empty-state-title">Nada por aquí todavía</div>';
      html += '<div class="empty-state-sub">Cuando alguien haga pública una rutina, aparecerá en esta lista para que te la lleves a tu Rutinario.</div>';
      html += '</div>';
    }else{
      html += '<div class="explore-list">';
      publicRoutinesList.forEach(function(p){
        var totalP = routineTotalSeconds({ steps: p.steps||[], rounds: p.rounds||1 });
        html += '<div class="explore-unit">';
        html += '<div><div class="explore-name">'+escapeHtml(p.name||"Sin nombre")+'</div>';
        html += '<div class="explore-meta">'+(p.steps?p.steps.length:0)+' ejercicio'+((p.steps&&p.steps.length===1)?"":"s")+' · '+fmtTime(totalP)+'</div></div>';
        html += '<button class="btn-outline" data-action="add-public-routine" data-id="'+p.id+'">'+icon("plus",15)+' Añadir</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function chipsRow(field, stepId, current, options){
    var html = '<div class="chips">';
    options.forEach(function(v){
      html += '<button type="button" class="chip'+(Number(current)===v?' active':'')+'" data-action="chip" data-field="'+field+'" data-val="'+v+'" data-step="'+stepId+'">'+(field==='rest'&&v===0?'sin descanso':v)+'</button>';
    });
    html += '</div>';
    return html;
  }

  function metricBox(labelText, unit, inputHtml, chipsHtml, extraClass){
    var html = '<div class="metric-box'+(extraClass?' '+extraClass:'')+'">';
    html += '<label>'+labelText+'</label>';
    html += '<div class="metric-input-row">'+inputHtml+(unit?'<span class="metric-unit">'+unit+'</span>':'')+'</div>';
    if(chipsHtml) html += chipsHtml;
    html += '</div>';
    return html;
  }

  function stepSummaryLine(step){
    var sets = Math.max(1, Number(step.sets)||1);
    var main = step.type === "time" ? (step.seconds||0)+"s" : (step.reps||0)+" reps";
    var parts = [main];
    if(sets>1) parts.push(sets+" series");
    if(step.rest) parts.push(step.rest+"s descanso");
    return parts.join(" · ");
  }

  function renderStepCard(step, i, count){
    var collapsed = collapsedSteps[step.id] !== false; // collapsed by default until opened
    var displayName = step.name ? escapeHtml(step.name) : ("Ejercicio "+(i+1));

    if(collapsed){
      var html0 = '<div class="step-row collapsed">';
      html0 += '<button class="step-summary-row" data-action="toggle-step" data-step="'+step.id+'">';
      html0 += '<span class="step-num">'+(i+1)+'</span>';
      html0 += '<span class="step-summary-text"><span class="step-summary-name">'+displayName+'</span><span class="step-summary-meta">'+stepSummaryLine(step)+'</span></span>';
      html0 += '<span class="step-chevron">'+icon("chevron-down",16)+'</span>';
      html0 += '</button>';
      html0 += '</div>';
      return html0;
    }

    var html = '<div class="step-row expanded">';

    html += '<div class="step-head">';
    html += '<button class="step-num step-num-btn" data-action="toggle-step" data-step="'+step.id+'" title="Contraer">'+(i+1)+'</button>';
    html += '<input class="step-name" data-field="name" data-step="'+step.id+'" value="'+escapeHtml(step.name)+'" placeholder="Nombre del ejercicio">';
    html += '<div class="step-menu">';
    html += '<button class="tool-btn" data-action="move-step" data-dir="up" data-step="'+step.id+'" '+(i===0?'disabled':'')+' title="Subir">'+icon("chevron-up",15)+'</button>';
    html += '<button class="tool-btn" data-action="move-step" data-dir="down" data-step="'+step.id+'" '+(i===count-1?'disabled':'')+' title="Bajar">'+icon("chevron-down",15)+'</button>';
    html += '<button class="tool-btn" data-action="duplicate-step" data-step="'+step.id+'" title="Duplicar">'+icon("copy",14)+'</button>';
    html += '<button class="tool-btn remove" data-action="remove-step" data-step="'+step.id+'" title="Eliminar">'+icon("x",15)+'</button>';
    html += '</div>';
    html += '</div>';

    html += '<div class="seg-toggle">';
    html += '<button type="button" class="'+(step.type==='time'?'active type-time':'')+'" data-action="set-type" data-type="time" data-step="'+step.id+'">Tiempo</button>';
    html += '<button type="button" class="'+(step.type==='reps'?'active type-reps':'')+'" data-action="set-type" data-type="reps" data-step="'+step.id+'">Repeticiones</button>';
    html += '</div>';

    html += '<div class="step-grid">';

    if(step.type === "time"){
      var secInput = '<input type="number" min="1" data-field="seconds" data-step="'+step.id+'" value="'+step.seconds+'">';
      html += metricBox("Duración", "seg", secInput, chipsRow("seconds", step.id, step.seconds, [15,20,30,45,60,90,120]), "metric-box-wide");
    }else{
      var repsInput = '<input type="number" min="0" data-field="reps" data-step="'+step.id+'" value="'+step.reps+'">';
      html += metricBox("Repeticiones", "", repsInput, "", "metric-box-wide");
    }

    var setsInput = '<input type="number" min="1" data-field="sets" data-step="'+step.id+'" value="'+(step.sets!=null?step.sets:1)+'">';
    html += metricBox("Series", "", setsInput, chipsRow("sets", step.id, step.sets!=null?step.sets:1, [1,2,3,4,5]));

    var restInput = '<input type="number" min="0" data-field="rest" data-step="'+step.id+'" value="'+step.rest+'">';
    html += metricBox("Descanso", "seg", restInput, chipsRow("rest", step.id, step.rest, [0,10,15,20,30,45,60]));

    if(step.type === "reps"){
      var estInput = '<input type="number" min="1" data-field="estSeconds" data-step="'+step.id+'" value="'+step.estSeconds+'">';
      html += metricBox("Tiempo estimado (para el total)", "seg", estInput, chipsRow("estSeconds", step.id, step.estSeconds, [20,30,40,60,90]), "metric-box-wide metric-box-secondary");
    }

    html += '</div>'; // step-grid

    html += '</div>';
    return html;
  }

  function renderPlayer(){
    if(player.phase === "done"){
      var routine = player.routine;
      var html = '<div class="summary">';
      html += '<div class="summary-check">'+icon("check",28)+'</div>';
      html += '<div class="summary-title">Entrenamiento completado</div>';
      html += '<div class="summary-sub">'+escapeHtml(routine?routine.name:"")+'</div>';
      html += '<div class="summary-stat">'+fmtTime(player.totalElapsed)+'</div>';
      if(player.deltaVsTarget != null){
        var d = player.deltaVsTarget;
        if(Math.abs(d) <= 5){
          html += '<div class="summary-sub">Igual que tu objetivo anterior</div>';
        }else if(d < 0){
          html += '<div class="summary-highlight">'+icon("trophy",13)+' '+fmtTime(Math.abs(d))+' más rápido que tu objetivo anterior</div>';
        }else{
          html += '<div class="summary-sub">'+fmtTime(d)+' más lento que tu objetivo anterior</div>';
        }
      }
      html += '<div class="summary-note">Próximo objetivo: '+fmtTime(player.totalElapsed)+'</div>';
      html += '<div class="summary-actions">';
      html += '<button class="btn btn-ghost btn-lg" data-action="back-home">'+icon("home",15)+' Inicio</button>';
      html += '<button class="btn btn-primary btn-lg" data-action="restart-routine" data-id="'+(routine?routine.id:"")+'">'+icon("play",15)+' Repetir</button>';
      html += '</div>';
      html += '</div>';
      return html;
    }

    var item = currentItem();
    if(!item) return "";
    var isRest = item.kind === "rest";
    var isTimed = isRest || item.type === "time";
    var routine = player.routine;
    var stepNumber = player.queue.slice(0, player.index+1).filter(function(q){return q.kind==="exercise";}).length;
    var exerciseCount = player.queue.filter(function(q){return q.kind==="exercise";}).length;
    var stepOfExtra = "";
    if(!isRest){
      if(item.setsTotal && item.setsTotal>1) stepOfExtra += " · Serie "+item.setIndex+"/"+item.setsTotal;
      if(item.roundsTotal && item.roundsTotal>1) stepOfExtra += " · Vuelta "+item.roundIndex+"/"+item.roundsTotal;
    }

    var html = '<div class="player">';

    html += '<div class="player-header">';
    html += '<div class="player-top">';
    html += '<button class="player-exit" data-action="exit-workout">'+icon("chevron-left",15)+' Salir</button>';
    html += '<span class="player-title">'+escapeHtml(routine.name)+'</span>';
    html += '</div>';

    var stepDotsActive = isRest ? -1 : stepNumber;
    var stepDotsDone = isRest ? stepNumber : stepNumber-1;
    var dotsHtml = '<div class="step-dots">';
    for(var di=1; di<=exerciseCount; di++){
      var dotCls = di===stepDotsActive ? "active" : (di<=stepDotsDone ? "done" : "");
      dotsHtml += '<span class="step-dot '+dotCls+'"></span>';
    }
    dotsHtml += '</div>';
    html += dotsHtml;
    html += '<span class="player-total" id="totalElapsed">'+fmtTime(player.totalElapsed)+' / '+fmtTime(player.totalPlanned)+'</span>';
    html += '</div>'; // player-header

    html += '<div class="hero">';
    var phaseLabel = isRest ? "Descanso" : ("Ejercicio "+Math.max(1,stepNumber)+" de "+exerciseCount+stepOfExtra);
    html += '<span class="phase-pill '+(isRest?'rest':'work')+'">'+phaseLabel+'</span>';

    if(isRest){
      html += '<h2 class="exercise-name">Descanso</h2>';
    }else{
      html += '<h2 class="exercise-name">'+escapeHtml(item.name)+'</h2>';
    }

    if(isRest && item.nextName){
      html += '<div class="next-up"><span class="next-up-label">Siguiente</span><span class="next-up-name">'+escapeHtml(item.nextName)+'</span></div>';
    }

    if(isTimed){
      var pct = item.seconds>0 ? Math.max(0,Math.min(100,(player.remaining/item.seconds)*100)) : 0;
      var ringPhase = isRest ? "rest" : "work";
      var CIRC = 339.3;
      var ringOffset = CIRC * (1 - pct/100);
      html += '<div class="timer-ring-wrap">';
      html += '<svg class="timer-ring" viewBox="0 0 120 120">';
      html += '<circle class="timer-ring-track" cx="60" cy="60" r="54"/>';
      html += '<circle class="timer-ring-fill '+ringPhase+'" id="ringFill" cx="60" cy="60" r="54" style="stroke-dasharray:'+CIRC+';stroke-dashoffset:'+ringOffset+'"/>';
      html += '</svg>';
      html += '<div class="timer-digits '+ringPhase+'" id="timerDigits">'+fmtTime(player.remaining)+'</div>';
      html += '</div>';
    }else{
      html += '<div class="reps-block">';
      html += '<div class="reps-number">'+(item.reps||"—")+'</div>';
      html += '<div class="reps-label">repeticiones</div>';
      html += '<div class="reps-stopwatch" id="repsStopwatch">'+fmtTime(player.repsElapsed)+'</div>';
      html += '<div class="reps-hint">Pulsa «Hecho»'+(state.settings.voice?' o di «hecho»':'')+' al terminar</div>';
      html += '</div>';
    }

    html += '</div>'; // hero

    html += '<div class="controls">';

    if(!isTimed){
      html += '<div class="done-btn-wrap"><button class="btn btn-go" data-action="confirm-done">'+icon("check",19)+' Hecho</button></div>';
    }

    html += '<div class="transport">';
    html += '<button class="transport-side" data-action="prev" '+(player.index<=0?'disabled':'')+' title="Anterior">'+icon("chevron-left",18)+'</button>';
    var mainVariant = isTimed ? "primary" : "secondary";
    if(player.phase === "running"){
      html += '<button class="transport-main '+mainVariant+'" data-action="pause">'+icon("pause",16)+' Pausar</button>';
    }else{
      html += '<button class="transport-main '+mainVariant+'" data-action="resume">'+icon("play",16)+' Reanudar</button>';
    }
    html += '<button class="transport-side" data-action="skip" title="Saltar">'+icon("chevron-right",18)+'</button>';
    html += '</div>';

    html += '<div class="audio-trigger-row"><button class="audio-trigger'+(audioPanelOpen?' open':'')+'" data-action="toggle-audio-panel">'+icon("volume",14)+' Audio '+icon(audioPanelOpen?"chevron-up":"chevron-down",13)+'</button></div>';

    if(audioPanelOpen){
      html += '<div class="audio-panel">';

      var voiceLabel = "Voz";
      var voiceOn = false, voiceListeningNow = false;
      if(!voiceSupported){ voiceLabel = "Voz no disponible"; }
      else if(voiceError){ voiceLabel = "Voz: error"; }
      else if(state.settings.voice && voiceListening){ voiceLabel = "Escuchando"; voiceOn = true; voiceListeningNow = true; }
      else if(state.settings.voice && !voiceListening){ voiceLabel = "Activando…"; voiceOn = true; }
      html += '<div class="audio-row'+(voiceOn?' active':'')+'"><span class="left">'+icon("mic",15)+' '+voiceLabel+'</span><button class="audio-switch'+(voiceOn?' on':'')+(voiceListeningNow?' listening':'')+'" data-action="toggle-voice" '+(!voiceSupported?'disabled':'')+' aria-label="Voz"></button></div>';
      if(voiceError){ html += '<div class="audio-error-text">'+voiceError+'</div>'; }

      html += '<div class="audio-row'+(state.settings.sound?' active':'')+'"><span class="left">'+icon("bell",15)+' Sonido</span><button class="audio-switch'+(state.settings.sound?' on':'')+'" data-action="toggle-sound" aria-label="Sonido"></button></div>';
      html += '<div class="audio-row'+(state.settings.announce?' active':'')+'"><span class="left">'+icon("volume",15)+' Aviso del siguiente</span><button class="audio-switch'+(state.settings.announce?' on':'')+'" data-action="toggle-announce" aria-label="Aviso del siguiente"></button></div>';

      if(voiceSupported){
        html += '<div class="audio-hint">Di «hecho» para confirmar un ejercicio de repeticiones, o «pausa» / «continúa» para el temporizador.</div>';
      }
      html += '</div>';
    }

    html += '<div class="end-link"><button data-action="exit-workout">Terminar entrenamiento</button></div>';

    html += '</div>'; // controls

    html += '</div>'; // player
    return html;
  }

  /* ============ init ============ */
  ensureSyncCode();
  render();
  pushToCloud();
  checkSharedRoutines();
})();
</script>
</body>
